<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Link</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ff4d4d, #990000);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 35px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .steps {
      text-align: left;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .steps span {
      display: block;
      margin-bottom: 8px;
      opacity: 0.95;
    }

    .highlight {
      font-weight: 600;
      color: #ffd6d6;
    }

    .loader {
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .timer {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 10px;
    }

    a {
      color: #fff;
      text-decoration: underline;
      font-size: 13px;
      opacity: 0.9;
    }

  </style>

  <script>
    let seconds = 7;

    function updateTimer() {
      const el = document.getElementById('countdown');
      if (seconds > 0) {
        el.textContent = seconds;
        seconds--;
      }
    }

    setInterval(updateTimer, 1000);

    setTimeout(() => {
      window.location.href = "https://link-target.net/3065510/WFisschte5fy";
    }, 7000);
  </script>
</head>

<body>
  <div class="card">
    <div class="loader"></div>

    <h1>Getting Your Link…</h1>

    <p>Follow these quick steps once redirected:</p>

    <div class="steps">
      <span>1. Click <span class="highlight">"Get Link"</span></span>
      <span>2. Choose <span class="highlight">"Free Access with Ads"</span></span>
      <span>3. Complete the <span class="highlight">3 short ads</span></span>
      <span>4. Done — your link will unlock 🎉</span>
    </div>

    <p class="timer">Redirecting in <span id="countdown">7</span> seconds...</p>

    <a href="https://link-target.net/3065510/WFisschte5fy">Click here if nothing happens</a>
  </div>
</body>
</html>
