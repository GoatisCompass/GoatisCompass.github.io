<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .loader {
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    a {
      color: #ffffff;
      text-decoration: underline;
      font-size: 14px;
    }
  </style>

  <script>
    setTimeout(() => {
      window.location.href = "https://link-target.net/3065510/WFisschte5fy";
    }, 1500);
  </script>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>Redirecting…</h1>
    <p>Taking you to Goatis Compass</p>
    <a href="https://link-target.net/3065510/WFisschte5fy">Click here if nothing happens</a>
  </div>
</body>
</html>
